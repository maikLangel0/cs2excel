[package]
name = "cs2excel"
version = "0.2.0" #cosmetic versioning LOL
edition = "2024"
authors = ["Mikael Lunde Isaksen"]
license = "GPL-3.0"
description = "Create, manage, update and track your CS2 inventory value."

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
debug = false

[[bin]]
name = "cs2excel"
path = "src/bin/cs2excel.rs"
required-features = ["cli", "gui"]

[[bin]]
name = "cs2excel_cli"
path = "src/bin/cs2excel_cli.rs"
required-features = ["cli"]

[[bin]]
name = "cs2excel_gui"
path = "src/bin/cs2excel_gui.rs"
required-features = ["gui"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151" }
reqwest = { version = "0.13.4", features = ["json", "brotli"] }
whoami = { version = "2.1.2" }
rusqlite = { version = "0.40.1", features = ["bundled"]} # use features = ["bundled"] if you're having problems with linking sqlite or you just dont have it installed.
tokio = { version = "1.51.1", features = ["fs"] }
flate2 = { version = "1.1.9" }
umya-spreadsheet = { version = "2.3.3" }
urlencoding = { version = "2.1.3" }
strum = { version = "0.28.0", features = ["derive"] }
rand = { version = "0.10.2" }
regex = { version = "1.13.1" }
chrono = { version = "0.4.45", features = ["serde"] }
# iced = { git = "https://github.com/iced-rs/iced.git", rev = "01c79ad8166386fe2b2e2685cf559a9bda142ef0", features = ["tokio", "sipper", "image"]} # branch = "master"
iced = { git = "https://github.com/iced-rs/iced.git", features = ["tokio", "sipper", "image"]}
indexmap = { version = "2.14.0", features = ["serde"] }
rfd = { version = "0.17.2", features = ["file-handle-inner"] }

sipper = "0.1.0"
dirs = "6.0.0"
open = "5.4.0"
ahash = "0.8.12"
num-traits = "0.2.19"

dhat = { version = "0.3.3" }

[features]
default  = ["cli", "gui"]

gui = []
cli = []

dhat-heap = []


[build-dependencies]
winresource = "0.1.31"
